[project]
name = "smooth-operator"
version = "0.1.0"
description = "Smooth operator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.1",
    "elevenlabs>=2.36.0",
    "fastapi>=0.129.0",
    "mistralai[realtime]>=1.12.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]
